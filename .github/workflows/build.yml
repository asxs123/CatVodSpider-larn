name: Build CatVodSpider

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        submodules: recursive  # 如果有子模块

    - name: 设置 Java 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: 设置 Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "latest"
        build-tools-version: "35.0.0"
        ndk-version: "26.1.10909125"

    - name: 安装必要的工具
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip

    - name: 下载 APKTool (如果不存在)
      run: |
        if [ ! -f "jar/3rd/apktool_2.11.0.jar" ]; then
          mkdir -p jar/3rd
          wget -O jar/3rd/apktool_2.11.0.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.0/apktool_2.11.0.jar
        fi

    - name: 给 gradlew 添加执行权限
      run: chmod +x ./gradlew

    - name: 清理构建缓存
      run: |
        ./gradlew clean --no-daemon || true
        rm -rf jar/Smali_classes
        rm -rf jar/spider.jar/smali
        rm -rf jar/spider.jar/org/slf4j
        rm -rf jar/spider.jar/build
        rm -rf jar/spider.jar/dist
        rm -f jar/custom_spider.jar
        rm -f jar/custom_spider.jar.md5

    - name: 编译 Android APK
      run: |
        echo "===== 第1步：编译 Android APK (assembleRelease) ====="
        ./gradlew assembleRelease --no-daemon --stacktrace

        if [ ! -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          echo "错误：编译失败，未找到 APK"
          exit 1
        fi
        echo "APK 编译成功: app/build/outputs/apk/release/app-release-unsigned.apk"

    - name: 生成 custom_spider.jar
      run: |
        echo "===== 第2步：生成 custom_spider.jar ====="

        # 清理旧产物
        rm -f jar/custom_spider.jar
        rm -rf jar/Smali_classes

        # 用 apktool 反编译 APK (仅提取 classes)
        echo "反编译 APK 提取 smali..."
        java -jar jar/3rd/apktool_2.11.0.jar d -f --only-main-classes \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          -o jar/Smali_classes

        # 清理 spider.jar 模板中的旧 smali
        rm -rf jar/spider.jar/smali/com/github/catvod/spider
        rm -rf jar/spider.jar/smali/com/github/catvod/js
        rm -rf jar/spider.jar/smali/org/slf4j

        # 创建目标目录
        mkdir -p jar/spider.jar/smali/com/github/catvod/
        mkdir -p jar/spider.jar/smali/org/slf4j/

        # 移动编译后的 smali 到 spider.jar 模板
        echo "移动 smali 文件到 spider.jar 模板..."

        if [ -d "jar/Smali_classes/smali/com/github/catvod/spider" ]; then
          mv jar/Smali_classes/smali/com/github/catvod/spider \
             jar/spider.jar/smali/com/github/catvod/
        else
          echo "警告：未找到 spider smali 目录，跳过"
        fi

        if [ -d "jar/Smali_classes/smali/com/github/catvod/js" ]; then
          mv jar/Smali_classes/smali/com/github/catvod/js \
             jar/spider.jar/smali/com/github/catvod/
        else
          echo "警告：未找到 js smali 目录，跳过"
        fi

        if [ -d "jar/Smali_classes/smali/org/slf4j" ]; then
          cp -r jar/Smali_classes/smali/org/slf4j/* \
             jar/spider.jar/smali/org/slf4j/
        else
          echo "警告：未找到 slf4j smali 目录，跳过"
        fi

        # 用 apktool 重新打包
        echo "重新打包为 JAR..."
        java -jar jar/3rd/apktool_2.11.0.jar b jar/spider.jar -c

        if [ ! -f "jar/spider.jar/dist/dex.jar" ]; then
          echo "错误：打包失败，未找到 jar/spider.jar/dist/dex.jar"
          exit 1
        fi

        # 移动到最终产物位置
        mv jar/spider.jar/dist/dex.jar jar/custom_spider.jar

        # 计算 MD5
        if command -v md5sum &>/dev/null; then
          md5sum jar/custom_spider.jar | awk '{print $1}' > jar/custom_spider.jar.md5
        elif command -v md5 &>/dev/null; then
          md5 -q jar/custom_spider.jar > jar/custom_spider.jar.md5
        else
          echo "警告：未找到 md5sum 或 md5 命令，跳过 MD5 计算"
        fi

        # 清理临时文件
        rm -rf jar/Smali_classes
        rm -rf jar/spider.jar/smali
        rm -rf jar/spider.jar/org/slf4j
        rm -rf jar/spider.jar/build
        rm -rf jar/spider.jar/dist

        echo "===== 生成完成 ====="
        echo "产物: jar/custom_spider.jar"
        if [ -f "jar/custom_spider.jar.md5" ]; then
          echo "MD5:  $(cat jar/custom_spider.jar.md5)"
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: catvodspider-build
        path: |
          jar/custom_spider.jar
          jar/custom_spider.jar.md5
          app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: 构建状态通知
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ 构建成功！"
          echo "产物已上传到 Actions artifacts"
        else
          echo "❌ 构建失败！"
          exit 1
        fi
